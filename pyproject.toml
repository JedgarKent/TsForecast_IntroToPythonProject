[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsforecast"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "statsmodels",
    "matplotlib",
    "yfinance>=1.7.0",
    "argparse>=1.4.0",
]

[tool.ruff]
line-length = 88
